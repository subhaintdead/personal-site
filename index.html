<!doctype html>
<html lang = "en">
<head>
<meta charset = "utf-8"/>
<meta name = "viewport" content = "width=device-width,  initial-scale=1.0"/>
<meta name = "keywords"  
content = "subh, terminal, portfolio"/>

<!-- font stuff -->
<link rel = "preconnect" href = "https://fonts.googleapis.com"/>
<link href = "https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inconsolata&display=swap" rel="stylesheet"/>
 <link href ="styles.css" rel="stylesheet" />


<title>Subh terminal</title>
</head>

<body>
    <div class = "terminal-window">

<div class = "centered" aria-hidden = "true">
    <span>subh@terminal</span>  
    </div>
    
        <div id="contentscroll">
     <div class="ascii-hero" role="presentation" aria-hidden="true">
        <pre class = "ascii-art">
███████╗██╗   ██╗██████╗ ██╗  ██╗
██╔════╝██║   ██║██╔══██╗██║  ██║
███████╗██║   ██║██████╔╝███████║
╚════██║██║   ██║██╔══██╗██╔══██║
███████║╚██████╔╝██████╔╝██║  ██║
╚══════╝ ╚═════╝ ╚═════╝ ╚═╝  ╚═╝
                                           </pre>       
        </div> 
     
        <section id="terminal">
            <a id = "b4"> </a>
            <div id="command"
            onclick="document.getElementById('texter').focus();">
   <label for="texter" id="prompt" class="sr-only"></label>
   <input 
   type="text"
    id="texter"
    class="texter"
   aria-label="Type a command and press enter"
   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          
<div id="liner">
    <span id="typer" aria-live="polite"></span>
    <b class="cursor" id="cursor" aria-hidden="true"></b>
    <div class="list"> </div>
 

</div>
</div>
</section>

<!--    js stuff-->
 <script src = "js/main.js" defer></script>
 <script src="js/cmds.js" defer></script>
 <script src = "js/tempfunc.js" defer></script>
<script src = "js/snake.js" defer></script>
    </div>
    </div>
    
</body>
</html>
